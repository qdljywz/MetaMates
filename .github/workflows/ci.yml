name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'metamates-app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'metamates-app/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: metamates-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: metamates-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Open-source hygiene
        run: npm run check:opensource

      # verify:round uses --skip-build; renderer assets must exist for functional checks.
      - name: Build renderer
        run: npx vite build && node scripts/restore-index-html.mjs

      - name: Typecheck, unit tests, functional checks
        run: npm run verify:round
        env:
          CI: true

      - name: UX guardrails (unit)
        run: npm run test:ux-guardrails

  # Linux Electron journey needs a display + sandbox debug loop; keep verify as the merge gate.
  # Re-enable after a green local `xvfb-run -a npm run test:e2e:smoke` on ubuntu-latest.
  e2e-smoke:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: metamates-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Install Electron Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 libgtk-3-0 libx11-xcb1 libxcb-dri3-0

      - name: Probe Electron under xvfb
        run: |
          xvfb-run -a npx electron --no-sandbox -e "const {app}=require('electron'); app.whenReady().then(() => { console.log('electron-ok'); app.quit(); });"

      - name: Run smoke e2e
        run: xvfb-run -a npm run test:e2e:smoke
        env:
          CI: true
          ELECTRON_EXTRA_LAUNCH_ARGS: --no-sandbox
